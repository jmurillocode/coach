name: Garmin sync

on:
  schedule:
    # Every 6 hours (runs happen through the day). Times are UTC.
    - cron: "0 */6 * * *"
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps
        run: pip install -r worker/garmin/requirements.txt

      - name: Run Garmin sync
        env:
          # Token auth (required in CI — Garmin blocks datacenter-IP logins).
          # Generate with worker/garmin/get_token.py and store as a repo secret.
          GARMINTOKENS_BASE64: ${{ secrets.GARMINTOKENS_BASE64 }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GARMIN_LOOKBACK: "20"
        run: python worker/garmin/sync.py
